name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # FIXED: Setup pnpm FIRST without installing, so setup-node can find it and cache it natively
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Setup Node.js Runtime & Native pnpm Cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm' # Let setup-node handle the cache directories automatically

      - name: Install Project Dependencies
        run: pnpm install --frozen-lockfile

      - name: Execute TypeScript Compilation Check
        run: pnpm exec tsc --noEmit
