name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Locked to Node 22 LTS to eliminate Node 24 experimental punycode warnings

      # FIXED: Installs pnpm globally as an npm tool to completely bypass internal action-setup workspace checks
      - name: Install pnpm Globally
        run: npm install -g pnpm@9

      - name: Setup Native Node pnpm Cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Project Dependencies
        run: pnpm install --frozen-lockfile

      - name: Execute TypeScript Compilation Check
        run: pnpm exec tsc --noEmit
