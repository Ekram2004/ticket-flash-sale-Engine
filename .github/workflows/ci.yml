name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # FIXED: Clean manual install entirely separate from setup-node's internal cache scanner hook
      - name: Install pnpm Globally
        run: npm install -g pnpm@9

      # FIXED: Force pnpm to completely ignore workspace layout structures for store locations
      - name: Configure Explicit Store Location
        run: pnpm config set store-dir ~/.pnpm-store --global

      - name: Install Project Dependencies
        run: pnpm install --frozen-lockfile

      - name: Execute TypeScript Compilation Check
        run: pnpm exec tsc --noEmit
